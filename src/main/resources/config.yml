config-version: 8

# Disabled until TEST acceptance. Enabling requires the alliance-capable LumaGuilds API.
reward-protection:
  enabled: false
  minimum-opposition-seconds: 30
  minimum-account-age-days: 7
  minimum-playtime-minutes: 120
  # Total executions of recipient-expanded commands per event, across all reward rows.
  maximum-recipient-commands: 1
  repeated-opponent-window-hours: 24
  # Zero disables the repeated-opponent limit only.
  maximum-repeated-wins: 2

# MaceGuard enforces the current rotation inside its configured warzone regions.
# KOTH adds no competing item/cooldown policy when this is true.
combat:
  follow-warzone-rotation: true

# Limits are opt-in. Teams are accounts/guilds, not verified unique humans.
fairness:
  contributor-minimum-percent: 10.0
  starter-cooldown-seconds: 0
  minimum-online-teams: 0
  minimum-participating-teams: 0

# Capture updates/displays are restricted to these WorldGuard regions in the event world.
# Start and winner announcements remain global (respecting the notification opt-out).
notifications:
  capture-regions: [spawn, warzone, market]

general:
  timezone: "America/New_York"

locks:
  state: "UNLOCKED"

manual-start:
  enabled: true
  basic-cost: 0.0
  advanced-cost: 0.0
  delay-seconds: 0

private-testing:
  lobby-seconds: 0
  quick-match-duration-seconds: 120
  quick-capture-seconds: 15

schedule:
  enabled: false
  pre-start-warning-seconds: 300
  times:
    - "00:00"
    - "08:00"
    - "16:00"

flares:
  enabled: true
  item:
    material: "REDSTONE_TORCH"
    name: "&c{KOTH} Koth Flare"
    lore:
      - "&7Right-Click to start a &c{KOTH} &7koth!"

progress-bar:
  enabled: true
  length: 10
  character: "|"

reminders:
  enabled: true
  interval-seconds: 300

discord:
  enabled: false
  webhook-url: ""
  # Optional quoted role ID. Only public start announcements ping this role.
  start-role-id: ""
  pre-start-ping-minutes: 10
  live-update-seconds: 60
  # Live status edits one message per event, including its final result.
  # Results post separately only when no live message can be finalized.
  # Plain-text placeholders: {arena}, {location}, {capper}, {winner}, {time_left},
  # {status}, {reason}, {minutes}, {event_id}. Discord supports Markdown and emojis.
  # Hex colors must be quoted. Empty fields: [] removes fields; omitted keys use defaults.
  embeds:
    pre-start:
      enabled: true
      title: "⏰ KOTH Starting Soon"
      description: ""
      color: "#F39C12"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}
        - {name: "Starts In", value: "{minutes} minute(s)", inline: true}
    start:
      enabled: true
      title: "🔥 KOTH Started!"
      description: ""
      color: "#3498DB"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}
        - {name: "Location", value: "{location}", inline: true}
    live:
      enabled: true
      title: "🏆 KOTH — {arena}"
      description: ""
      color: "#F1C40F"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}
        - {name: "Currently Capped By", value: "{capper}", inline: true}
        - {name: "Time Left", value: "{time_left}", inline: true}
        - {name: "Status", value: "{status}"}
    winner:
      enabled: true
      title: "🎉 KOTH Captured!"
      description: ""
      color: "#2ECC71"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}
        - {name: "Captured By", value: "{winner}", inline: true}
        - {name: "Result", value: "{winner} captured {arena}!"}
    cancelled:
      enabled: true
      title: "🛑 KOTH Cancelled"
      description: ""
      color: "#E67E22"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}
        - {name: "Reason", value: "{reason}"}
    no-winner:
      enabled: true
      title: "⌛ KOTH Ended — No Winner"
      description: "{arena} ended without a winner."
      color: "#95A5A6"
      timestamp: true
      fields:
        - {name: "KOTH", value: "{arena}", inline: true}

display:
  zone-border: true
  bossbar: true
  actionbar: true
  hologram: false
  scoreboard: false
  bossbar-color: RED
  bossbar-overlay: PROGRESS
  bossbar-title: "" # Blank uses lang/en_US.yml; MiniMessage placeholders koth_name, capper, time, contested.

rules:
  defaults:
    capture: &default-rules
      elytra: true
      mace: "FULLY_ALLOWED"
      spear: true
      ender-pearl: true
      wind-charge: true
      mace-cooldown-seconds: 0
      spear-cooldown-seconds: 0
      ender-pearl-cooldown-seconds: 0
      wind-charge-cooldown-seconds: 0
    moving: *default-rules
    conquest: *default-rules

arenas:
  capture:
    # Optional visible name. Blank keeps the stable arena ID. Up to 64 visible characters.
    # Colors &c / &#FFAA00, legacy decorations and emojis are supported; e.g. "&#FFAA00&lSummit 🏆".
    display-name: ""
    enabled: true
    keep-inventory: false
    keep-experience: true
    # Empty means use rewards.<family>. Set a separate family for lower-risk payouts.
    reward-family: ""
    family: "capture"
    world: "world"
    worldguard-region: ""
    center: { x: 0.5, y: 80.0, z: 0.5 }
    protected-region:
      corner-1: { x: -32.0, y: -64.0, z: -32.0 }
      corner-2: { x: 32.0, y: 320.0, z: 32.0 }
    radius: 5.0
    duration-seconds: 900
    capture-seconds: 120
    leave-behavior: "RESET"
    decay-per-second: 1.0
    ignore-factions: false
    contest-when-multiple-cappers: true
    flares-must-be-placed-on-cap: true
    schedule: []
    rewards:
      - "bank 500"
    chanced-rewards:
      "20.0": "bank 50"
  moving:
    enabled: true
    family: "moving"
    world: "world"
    worldguard-region: ""
    center: { x: 40.5, y: 80.0, z: 40.5 }
    protected-region:
      corner-1: { x: 8.5, y: -64.0, z: 8.5 }
      corner-2: { x: 72.5, y: 320.0, z: 72.5 }
    radius: 5.0
    duration-seconds: 900
    square-size: 20.0
    speed-blocks-per-second: 1.0
    ignore-factions: false
    schedule: []
    rewards: []
    chanced-rewards: {}
  conquest:
    enabled: false
    family: "conquest"
    world: "world"
    worldguard-region: ""
    center: { x: 0.0, y: 80.0, z: 0.0 }
    protected-region:
      corner-1: { x: -48.0, y: -64.0, z: -48.0 }
      corner-2: { x: 48.0, y: 320.0, z: 48.0 }
    radius: 5.0
    duration-seconds: 1200
    ignore-factions: false
    schedule: []
    rewards: []
    chanced-rewards: {}
    capture-speed-bonuses:
      1: 1.0
      2: 1.5
      3: 2.0

rewards:
  capture:
    solo-vault-money: 0.0
    guild-vault-money: 0.0
  moving:
    solo-vault-money: 0.0
    guild-vault-money: 0.0
  conquest:
    solo-vault-money: 0.0
    guild-vault-money: 0.0

# Concurrent public events require nonoverlapping native arenas; private tests remain exclusive.
events:
  max-concurrent: 1

# Inclusive local date; leave blank until a season has been selected.
leaderboards:
  season-start: ""
